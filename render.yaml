# Render.com uchun tayyor sozlama: README'dagi "Deploy to Render" tugmasi shuni ishlatadi.
services:
  - type: web
    name: osh-markazi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GITHUB_TOKEN      # ma'lumotlar o'chib ketmasligi uchun (ixtiyoriy, README'ga qarang)
        sync: false
      - key: DATA_REPO         # masalan: Abduvahobb/My_Plov
        sync: false
